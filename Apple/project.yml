# XcodeGen spec for the iOS and macOS apps. Generate with: cd Apple && xcodegen
name: Figures
options:
  bundleIdPrefix: local.figures
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  FiguresKit:
    path: ..
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    # Set your Apple team here or in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""
targets:
  Figures-iOS:
    type: application
    platform: iOS
    sources:
      - path: ../App
      - path: Assets.xcassets
    dependencies:
      - package: FiguresKit
        product: SheetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.figures.Figures
        PRODUCT_NAME: Figures
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: iOS-Info.plist
      properties:
        CFBundleDisplayName: Figures
        NSHumanReadableCopyright: © 2026 Tarik Naeem. Released under the MIT License.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Excel Workbook
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.spreadsheetml.sheet]
          - CFBundleTypeName: Excel Macro-Enabled Workbook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.spreadsheetml.sheet.macroenabled]
          - CFBundleTypeName: CSV Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openxmlformats.spreadsheetml.sheet
            UTTypeDescription: Excel Workbook
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [xlsx]
              public.mime-type: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
  Figures-macOS:
    type: application
    platform: macOS
    sources:
      - path: ../App
      - path: Assets.xcassets
    dependencies:
      - package: FiguresKit
        product: SheetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.figures.Figures
        PRODUCT_NAME: Figures
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: macOS-Info.plist
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
